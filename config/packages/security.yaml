security:
    role_hierarchy:
        ROLE_ADMIN: ROLE_STAFF
        ROLE_STAFF: ROLE_USER

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User:
            algorithm: auto
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    # providers:
    #     users_in_memory: { memory: null }
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            security: false

        api_platform:     
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\EmailVerifiedUserChecker
            custom_authenticator: App\Security\LoginAuthenticator
            access_denied_handler: App\Security\AccessDeniedHandler
            logout:
                path: /logout
                target: /login
            

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Admin-only routes (must be first to take precedence)
        - { path: ^/dashboard, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/settings, roles: ROLE_ADMIN }
        
        # Staff routes
        - { path: ^/staff/google, roles: PUBLIC_ACCESS }
        - { path: ^/staff, roles: ROLE_STAFF }

        # Staff management routes
        - { path: ^/order, roles: ROLE_STAFF }
        - { path: ^/customer, roles: ROLE_STAFF }
        - { path: ^/stock, roles: ROLE_STAFF }
        
        # User routes
        # Allow public browsing of products (ordering/cart still requires login)
        - { path: ^/user/dashboard, roles: PUBLIC_ACCESS }
        
        # Public routes
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }

        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/products, roles: PUBLIC_ACCESS }
        - { path: ^/api/stocks, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon